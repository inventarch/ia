  tsx: ^4.22.3
  typescript: ^7.0.2
  vitest: ^4.1.4
nodeLinker: hoisted
# Pin patched Nx transitive dependencies.
overrides:
  "nx>axios": "1.20.0"
  "nx>brace-expansion": "5.0.12"
  "nx>smol-toml": "1.9.0"
