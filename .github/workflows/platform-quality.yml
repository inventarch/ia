name: Public quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      full:
        description: Bypass every local and remote task reuse
        type: boolean
        default: false
  schedule:
    # Weekly full verification of all declared variants, with no task reuse at all. It skips every job after the plan
    # when main has not moved since the last successful scheduled run.
    - cron: '0 3 * * 0'

permissions:
  contents: read

concurrency:
  # Each main commit keeps its own run: npm publication requires a passing run for the exact release commit, and a
  # later merge must not cancel it. Branch and pull-request runs still supersede each other. A pull request edit that
  # keeps its base only copies a verdict (tests:plan reusesVerdict), so it has its own group and cancels no check.
  group: public-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}${{ github.event.action == 'edited' && !github.event.changes.base && '-edit' || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every env key here, at any level, is either an Nx { "env": … } input or listed in tools/testing/inventory.test.ts as
# unable to change a task's result: package tasks do not hash this file, so a key a task reads is otherwise ignored.
env:
  # Bump to invalidate results a defect has made unsound. It is a hashed input of every task.
  NX_CACHE_EPOCH: '2'
  # Scheduled and dispatched full runs execute everything; ordinary runs may reuse task results.
  IA_FULL: ${{ (github.event_name == 'schedule' || inputs.full) && 'true' || '' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Reading this workflow's earlier runs needs actions: read; only this job reads them.
    permissions:
      contents: read
      actions: read
    outputs:
      tests: ${{ steps.matrices.outputs.tests }}
      build: ${{ steps.matrices.outputs.build }}
      static: ${{ steps.matrices.outputs.static }}
      emitted: ${{ steps.matrices.outputs.emitted }}
      gate: ${{ steps.matrices.outputs.gate }}
      platforms: ${{ steps.matrices.outputs.platforms }}
      run: ${{ steps.matrices.outputs.run }}
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      # First, before anything that can fail: a later edit's copy then knows this run for a copy, never a full run.
      - name: Mark this run as a copied verdict
        if: github.event.action == 'edited' && !github.event.changes.base
        run: echo "A pull request edit that keeps its base copies the head commit's last full verdict."
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # The full required task set for this checkout. A new unassigned test fails here, before
      # anything is scheduled; a deleted file cannot silently remove an obligation.
      - name: Check dependency advisories
        run: pnpm audit --audit-level=moderate
      # Cohort versions, the published changeset's integrity, and a pending release note for every changed package.
      # Exact file coverage is checked only where a publication is prepared (pnpm release:check --strict).
      - name: Validate cohort versions and pending release notes
        run: pnpm release:check
      - name: Validate the test inventory
        run: pnpm tests:inventory
      # The commit the last successful scheduled run verified. If it cannot be read the run verifies anyway: a failed
      # lookup costs minutes, never coverage.
      - name: Find the commit the last scheduled run verified
        id: verified
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          sha="$(gh api "repos/${{ github.repository }}/actions/workflows/platform-quality.yml/runs?event=schedule&status=success&branch=main&per_page=1" --jq '.workflow_runs[0].head_sha // empty')" || { echo "::warning::could not read the last successful scheduled run; verifying anyway"; sha=""; }
          echo "Last successful scheduled run verified ${sha:-nothing}; main is at ${{ github.sha }}."
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # Public source tasks use four general lanes on Linux, six on Windows and three on macOS. Windows runs the
      # slowest, so it gets the most lanes. Hosted minutes are free on this public repository; what limits macOS is
      # the organization's five concurrent macOS jobs, shared by every run. Static, emitted and three test shards
      # fill all five, so a second run's macOS jobs wait for a slot (tools/testing/plan.test.ts holds this). The
      # Homebrew smoke needs only the plan and can outlast the macOS build; while it runs, one of the five waits.
      # Pull requests targeting main and every other trigger plan Linux, Windows and macOS. The planner also
      # emits the gate's rows, run=false for a scheduled run on an already verified main, and run=reuse for a pull
      # request edit that keeps its base.
      - name: Assign tasks to shards
        id: matrices
        run: pnpm --silent tests:plan --ci-matrix --shards linux=4,windows=6,macos=3 --native-shards linux=0,windows=0,macos=0 --event ${{ github.event_name }} --head-sha ${{ github.sha }} --verified-sha "${{ steps.verified.outputs.sha }}" --action "${{ github.event.action }}" --base-changed ${{ github.event.changes.base && 'true' || 'false' }} >> "$GITHUB_OUTPUT"
      # A reuse run runs no lane. This step fails unless the head commit's last full run of this workflow finished and
      # passed, so an edit can never turn a failed or unverified commit green. Earlier copies are not full runs.
      - name: Copy the verdict of this commit's last full run
        id: verdict
        if: steps.matrices.outputs.run == 'reuse'
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm --silent tests:verdict --repo ${{ github.repository }} --workflow platform-quality.yml --run-id ${{ github.run_id }} --head-sha ${{ github.event.pull_request.head.sha }} >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    needs: plan
    # A scheduled run on a main the last scheduled run already verified skips this job.
    if: needs.plan.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/cache/restore@v6
        if: env.IA_FULL == ''
        with:
          path: |
            .nx/cache
            .nx/workspace-data
          key: public-build-${{ runner.os }}-${{ runner.arch }}-${{ env.NX_CACHE_EPOCH }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-${{ github.sha }}
          restore-keys: public-build-${{ runner.os }}-${{ runner.arch }}-${{ env.NX_CACHE_EPOCH }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-
      - name: Run assigned tasks
        run: pnpm tests:orchestrate --tasks "${{ matrix.tasks }}" --evidence-out artifacts/evidence ${{ env.IA_FULL && '--full' || '' }}
      - uses: actions/cache/save@v6
        if: env.IA_FULL == '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: |
            .nx/cache
            .nx/workspace-data
          key: public-build-${{ runner.os }}-${{ runner.arch }}-${{ env.NX_CACHE_EPOCH }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-${{ github.sha }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-${{ matrix.platform }}-build
          path: artifacts/evidence
          if-no-files-found: warn
          retention-days: 14

  static:
    name: Static checks (${{ matrix.os }})
    needs: [plan, build]
    if: needs.plan.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.static) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/cache/restore@v6
        if: env.IA_FULL == ''
        with:
          path: |
            .nx/cache
            .nx/workspace-data
          key: public-static-${{ runner.os }}-${{ runner.arch }}-${{ env.NX_CACHE_EPOCH }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-${{ github.sha }}
          restore-keys: public-static-${{ runner.os }}-${{ runner.arch }}-${{ env.NX_CACHE_EPOCH }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-
      - name: Run assigned tasks
        run: pnpm tests:orchestrate --tasks "${{ matrix.tasks }}" --evidence-out artifacts/evidence ${{ env.IA_FULL && '--full' || '' }}
      - uses: actions/cache/save@v6
        if: env.IA_FULL == '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: |
            .nx/cache
            .nx/workspace-data
          key: public-static-${{ runner.os }}-${{ runner.arch }}-${{ env.NX_CACHE_EPOCH }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-${{ github.sha }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-${{ matrix.platform }}-static
          path: artifacts/evidence
          if-no-files-found: warn
          retention-days: 14

  tests:
    name: Tests — ${{ matrix.tasks }} (${{ matrix.os }})
    needs: [plan, build]
    if: needs.plan.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    # The task step stops at 55 minutes; the rest leaves setup up to 15 minutes before it, so the step's own limit,
    # not the job's, ends a shard that runs out of time.
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.tests) }}
    steps:
      # First, so the warning at the end measures every step of the job.
      - name: Note when the job started
        shell: bash
        run: date +%s > "$RUNNER_TEMP/job-started"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # Each job rebuilds missing prerequisites through the declared task dependency graph.
      - uses: actions/cache/restore@v6
        if: env.IA_FULL == ''
        with:
          path: |
            .nx/cache
            .nx/workspace-data
          key: public-tests-${{ runner.os }}-${{ runner.arch }}-${{ env.NX_CACHE_EPOCH }}-${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-${{ github.sha }}
          restore-keys: public-tests-${{ runner.os }}-${{ runner.arch }}-${{ env.NX_CACHE_EPOCH }}-${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-
      # Inside the job's 70 minutes, so a shard that runs out of time fails this step rather than the job: the timeout
      # warning below still runs for it. The tasks it finished upload no evidence, because the runner collects evidence
      # only after Nx returns.
      - name: Run assigned tasks
        timeout-minutes: 55
        run: pnpm tests:orchestrate --tasks "${{ matrix.tasks }}" --evidence-out artifacts/evidence ${{ env.IA_FULL && '--full' || '' }}
      - uses: actions/cache/save@v6
        if: env.IA_FULL == '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: |
            .nx/cache
            .nx/workspace-data
          key: public-tests-${{ runner.os }}-${{ runner.arch }}-${{ env.NX_CACHE_EPOCH }}-${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-${{ github.sha }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-${{ matrix.platform }}-tests-${{ matrix.shard }}
          path: artifacts/evidence
          if-no-files-found: warn
          retention-days: 14
      # A shard past 40 minutes is near the task step's 55-minute limit: re-record the schedule or split its longest
      # task before it reaches it. A shard that hit that limit warns here too. The warning never changes the job's
      # result.
      - name: Warn when the shard nears its timeout
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          minutes=$(( ($(date +%s) - $(cat "$RUNNER_TEMP/job-started")) / 60 ))
          echo "This test shard took $minutes minutes."
          if [ "$minutes" -ge 40 ]; then echo "::warning::Test shard ${{ matrix.shard }} on ${{ matrix.platform }} took $minutes minutes, and its task step stops at 55; refresh tools/testing/schedule.json or split its longest task."; fi

  emitted:
    name: Emitted qualification (${{ matrix.os }})
    needs: [plan, build]
    if: needs.plan.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.emitted) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/cache/restore@v6
        if: env.IA_FULL == ''
        with:
          path: |
            .nx/cache
            .nx/workspace-data
          key: public-emitted-${{ runner.os }}-${{ runner.arch }}-${{ env.NX_CACHE_EPOCH }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-${{ github.sha }}
          restore-keys: public-emitted-${{ runner.os }}-${{ runner.arch }}-${{ env.NX_CACHE_EPOCH }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-
      - name: Run assigned tasks
        run: pnpm tests:orchestrate --tasks "${{ matrix.tasks }}" --evidence-out artifacts/evidence ${{ env.IA_FULL && '--full' || '' }}
      - uses: actions/cache/save@v6
        if: env.IA_FULL == '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: |
            .nx/cache
            .nx/workspace-data
          key: public-emitted-${{ runner.os }}-${{ runner.arch }}-${{ env.NX_CACHE_EPOCH }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json') }}-${{ github.sha }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-${{ matrix.platform }}-emitted
          path: artifacts/evidence
          if-no-files-found: warn
          retention-days: 14

  homebrew-node:
    # Homebrew's Node links the macOS system zlib, which encodes archives differently from official Node builds.
    # The CLI's bundled archives must still verify there: initialize, register and validate a workspace with it.
    # It uses node@22, the declared Node major, never Homebrew's floating `node`, and it refuses to run unless
    # `ia doctor` places that runtime inside the declared target and the build links the system zlib.
    # It runs only when the plan includes macOS and the run has something to verify, and it
    # starts as soon as the plan says so; every platform's gate row waits for it.
    name: Homebrew Node smoke (macos-26)
    needs: plan
    if: needs.plan.outputs.run == 'true' && contains(fromJSON(needs.plan.outputs.platforms), 'macos')
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # The whole root build: only it writes the bundled base archive and the host payload (language-base:generate,
      # host-payload:generate). A filtered `@inventarch/cli...` build leaves `init` without apps/cli/assets/base.json.
      - name: Build the CLI and its bundled archives
        run: pnpm build
      # The runner image's formulae, not a `brew update` in the middle of the job, and nothing else is cleaned up.
      - name: Install Homebrew's Node 22
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install node@22
      - name: Initialize, register and validate a workspace with Homebrew's Node
        shell: bash
        run: |
          set -euo pipefail
          node_bin="$(brew --prefix node@22)/bin/node"
          "$node_bin" -p '`Homebrew Node ${process.version}, zlib ${process.versions.zlib}`'
          scratch="$(python3 -c 'import os,tempfile;print(os.path.realpath(tempfile.mkdtemp()))')"
          mkdir -p "$scratch/home"
          export HOME="$scratch/home" IA_HOME="$scratch/ia-home"
          cli="$GITHUB_WORKSPACE/apps/cli/dist/main.js"
          # The doctor's exit class also covers workspace state; only its support-target check matters here.
          (cd "$scratch" && "$node_bin" "$cli" doctor --json) > "$scratch/doctor.json" || true
          "$node_bin" -e '
            const target = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).checks.find((check) => check.id === "support-target");
            console.log(`Support target: ${target.status}, ${target.detail}`);
            if (target.status !== "ok") process.exit(1);
            if (process.config.variables.node_shared_zlib !== true) { console.log("This Node bundles its own zlib instead of linking the system one"); process.exit(1); }
          ' "$scratch/doctor.json"
          # The CLI contract's init row: three authored records, then the capture and project effects, reported apart.
          "$node_bin" "$cli" init "$scratch/demo" --apply --yes --json > "$scratch/init.json"
          "$node_bin" -e '
            const { applied } = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            console.log(`Authored ${applied.authored.join(", ")}; captured ${applied.effects.capture.records} records; project ${applied.effects.project}`);
            if (applied.authored.length !== 3 || applied.distribution !== null || applied.effects.project !== "skipped") process.exit(1);
          ' "$scratch/init.json"
          "$node_bin" "$cli" host claude --root "$scratch/demo" --apply --yes
          # The projection is the position packet, with its receipt: no per-system agent file.
          test -f "$scratch/demo/.claude/rules/ia-workspace.md"
          test -f "$scratch/demo/.ia/distributions/hosts/claude-receipt.json"
          test ! -e "$scratch/demo/.claude/agents"
          "$node_bin" "$cli" validate --root "$scratch/demo"

  qualify:
    # The existing required check names. This job is the gate; it is never cached and runs whatever its prerequisites
    # did, unless the plan decided the run had nothing to verify. Every run gates all three platforms;
    # a plan that produced none fails this job rather than skipping it. A reuse run never skips it either, because a
    # skipped required check reads as passed: each row reports the copied verdict instead, on Linux, since it reads
    # nothing of its platform and a macOS slot is scarce.
    name: Emitted platform (${{ matrix.os }})
    needs: [plan, build, static, tests, emitted, homebrew-node]
    if: always() && needs.plan.outputs.run != 'false'
    runs-on: ${{ needs.plan.outputs.run == 'reuse' && 'ubuntu-latest' || matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.gate) }}
    steps:
      - name: Report the verdict of this commit's last full run
        if: needs.plan.outputs.run == 'reuse'
        shell: bash
        run: |
          echo "A pull request edit that keeps its base runs no lane; the Plan job's log names the run whose verdict this is."
          if [ "${{ needs.plan.result }}" != "success" ] || [ "${{ needs.plan.outputs.verdict }}" != "success" ]; then echo "::error::this head commit has no passed full run to report"; exit 1; fi
      - uses: actions/checkout@v7
        if: needs.plan.outputs.run != 'reuse'
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        if: needs.plan.outputs.run != 'reuse'
      - uses: actions/download-artifact@v8
        if: needs.plan.outputs.run != 'reuse'
        with:
          pattern: evidence-${{ matrix.platform }}-*
          merge-multiple: true
          path: artifacts/tests
      # Reported even when it fails, so the findings are visible rather than only the exit code.
      - name: Compare received results against the required task set
        id: gate
        if: needs.plan.outputs.run != 'reuse'
        continue-on-error: true
        run: pnpm tests:gate --evidence artifacts/tests --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        if: always() && needs.plan.outputs.run != 'reuse'
        with:
          name: gate-${{ matrix.platform }}
          path: artifacts/tests
          if-no-files-found: warn
          # The merged evidence tests:plan --record reads to re-record durations; the per-job uploads above only feed it.
          retention-days: 30
      # This run's executed durations as a candidate schedule. Best effort: it never changes the gate's result.
      - name: Export this platform's executed durations
        if: always() && needs.plan.outputs.run != 'reuse'
        continue-on-error: true
        run: pnpm tests:plan --record artifacts/tests --record-out artifacts/schedule/schedule.json
      - uses: actions/upload-artifact@v7
        if: always() && needs.plan.outputs.run != 'reuse'
        continue-on-error: true
        with:
          name: schedule-${{ matrix.platform }}
          path: artifacts/schedule
          if-no-files-found: warn
          retention-days: 30
      # A skipped or cancelled prerequisite must not read as a green aggregate. The comparison
      # above catches a missing result too; this names the job that did not finish. The Homebrew smoke is required only
      # when the plan includes macOS; otherwise its skip is expected.
      - name: Refuse an aggregate built on unfinished work
        if: needs.plan.outputs.run != 'reuse'
        shell: bash
        run: |
          failed=""
          for pair in "plan:${{ needs.plan.result }}" "build:${{ needs.build.result }}" "static:${{ needs.static.result }}" "tests:${{ needs.tests.result }}" "emitted:${{ needs.emitted.result }}" "homebrew-node:${{ (needs.homebrew-node.result == 'skipped' && !contains(fromJSON(needs.plan.outputs.platforms), 'macos')) && 'not-planned' || needs.homebrew-node.result }}"; do
            name="${pair%%:*}"; outcome="${pair#*:}"
            if [ "$outcome" = "not-planned" ]; then continue; fi
            if [ "$outcome" != "success" ]; then echo "::error::required job $name finished as $outcome"; failed="yes"; fi
          done
          if [ "${{ steps.gate.outcome }}" != "success" ]; then echo "::error::the received results do not cover the required task set"; failed="yes"; fi
          [ -z "$failed" ]
